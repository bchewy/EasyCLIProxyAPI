name: Build private macOS artifact
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
          cache: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - uses: dtolnay/rust-toolchain@1.99.0
      - name: Build pinned private core, GUI and package
        run: bash build.sh
      - uses: actions/upload-artifact@v7
        with:
          name: EasyCLIProxyAPI-Private-macOS-arm64
          path: bin-work/
          if-no-files-found: error
